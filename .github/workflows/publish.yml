name: Publish

on:
  pull_request:
    paths:
      - "package.json"
      - "README*.md"
      - "extensions/**"
      - "themes/**"
      - ".github/workflows/publish.yml"
  push:
    branches:
      - main
    tags:
      - "v*.*.*"
    paths:
      - "package.json"
      - "README*.md"
      - "extensions/**"
      - "themes/**"
      - ".github/workflows/publish.yml"
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish the current package version to npm"
        required: true
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write

jobs:
  validate:
    name: Validate package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Show package metadata
        run: npm pkg get name version

      - name: Validate npm package contents
        run: npm pack --dry-run

  publish:
    name: Publish package
    runs-on: ubuntu-latest
    needs: validate
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publish)
    environment: npm
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Ensure tag matches package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          node -e "const pkg=require('./package.json'); const tag=process.env.GITHUB_REF_NAME; if (tag !== 'v' + pkg.version) { console.error(`Tag ${tag} does not match package version v${pkg.version}`); process.exit(1); }"

      - name: Publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --access public --provenance
